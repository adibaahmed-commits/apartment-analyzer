<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XTrace — Upload a building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#170A0D;
    --wine:#2B0F16;
    --wine-light:#3D1620;
    --rose:#E8536B;
    --rose-dim:#B33D50;
    --cyan:#5EEAD4;
    --bone:#F4E9E6;
    --mute:#A8858C;
    --line:rgba(244,233,230,0.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  h1,h2,.display{font-family:'Fraunces', serif;font-weight:600;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}

  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(232,83,107,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 20%, rgba(94,234,212,0.06), transparent 55%);
    pointer-events:none;z-index:0;
  }

  nav{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 28px;
    background:rgba(23,10,13,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;}
  .logo .x{color:var(--rose);}
  .back{font-size:0.88rem;color:var(--mute);}
  .back:hover{color:var(--bone);}

  .wrap{
    max-width:560px;margin:0 auto;
    padding:80px 28px 60px;
    position:relative;z-index:1;
  }
  .eyebrow{
    font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--cyan);font-weight:600;
  }
  h1{font-size:clamp(2rem,4.5vw,2.8rem);margin:14px 0 10px;}
  .sub{color:var(--mute);font-size:0.98rem;line-height:1.6;margin-bottom:40px;}

  /* dropzone */
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:16px;
    padding:48px 24px;
    text-align:center;
    cursor:pointer;
    background:var(--wine);
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .dropzone.drag{
    border-color:var(--rose);
    background:var(--wine-light);
  }
  .dropzone input{display:none;}
  .dz-icon{
    width:52px;height:52px;margin:0 auto 18px;
    border-radius:50%;
    background:rgba(94,234,212,0.1);
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan);font-size:1.4rem;
  }
  .dz-title{font-weight:600;margin-bottom:6px;}
  .dz-sub{color:var(--mute);font-size:0.85rem;}

  /* preview */
  .preview{
    display:none;
    margin-top:20px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:var(--wine);
  }
  .preview.show{display:block;}
  .preview img{width:100%;display:block;max-height:280px;object-fit:cover;}
  .preview-info{
    padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:0.85rem;color:var(--mute);
  }
  .preview-info button{
    background:none;border:none;color:var(--rose);
    font-size:0.85rem;cursor:pointer;font-family:inherit;font-weight:600;
  }

  .btn-primary{
    width:100%;
    margin-top:24px;
    background:var(--rose);color:var(--void);
    padding:15px 26px;border-radius:10px;
    font-weight:600;font-size:0.98rem;
    border:none;cursor:pointer;
    box-shadow:0 8px 30px -8px rgba(232,83,107,0.55);
    transition:transform .15s ease, opacity .15s ease;
    font-family:inherit;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .status{
    margin-top:16px;
    font-size:0.88rem;
    text-align:center;
    min-height:20px;
  }
  .status.error{color:var(--rose);}
  .status.loading{color:var(--cyan);}
  .status.success{color:var(--cyan);}

  ::selection{background:var(--rose);color:var(--void);}
</style>
</head>
<body>

<nav>
  <div class="logo"><span class="x">X</span>Trace</div>
  <a href="index.html" class="back">← Back to home</a>
</nav>

<div class="wrap">
  <span class="eyebrow">Upload a building photo</span>
  <h1>Let's scan it.</h1>
  <p class="sub">Drop a clear photo of a building's exterior below. Street-level or from across the block both work.</p>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <div class="dz-icon">↑</div>
    <div class="dz-title">Tap to choose a photo</div>
    <div class="dz-sub">or drag and drop — JPG, PNG, up to 10MB</div>
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" src="" alt="Selected building photo">
    <div class="preview-info">
      <span id="fileName"></span>
      <button id="removeBtn" type="button">Remove</button>
    </div>
  </div>

  <button class="btn-primary" id="scanBtn" disabled>Scan this building →</button>
  <div class="status" id="status"></div>
</div>

  <script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const fileName = document.getElementById('fileName');
  const removeBtn = document.getElementById('removeBtn');

  const scanBtn = document.getElementById('scanBtn');
  const status = document.getElementById('status');

  let selectedFile = null;

  const UPLOAD_ENDPOINT = "https://xtrace-backend.onrender.com/buildings/upload";

  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      handleFile(fileInput.files[0]);
    }
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) {
      showStatus('Please choose an image file.', 'error');
      return;
    }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      fileName.textContent = file.name;
      preview.classList.add('show');
      scanBtn.disabled = false;
      showStatus('', '');
    };
    reader.readAsDataURL(file);
  }

  removeBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    preview.classList.remove('show');
    scanBtn.disabled = true;
  });

  scanBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    scanBtn.disabled = true;
    showStatus('Scanning building…', 'loading');

    const formData = new FormData();
    formData.append('file', selectedFile); // backend expects "file", not "image"

    try {
      const response = await fetch(UPLOAD_ENDPOINT, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`Upload failed with status ${response.status}: ${errText}`);
      }

      const data = await response.json();

      // backend returns { building_id, status, image_url }
      if (data.building_id) {
        window.location.href = `details.html?id=${data.building_id}`;
      } else {
        showStatus('Scan complete.', 'success');
      }

    } catch (err) {
      console.error(err);
      showStatus('Something went wrong. Please try again.', 'error');
      scanBtn.disabled = false;
    }
  });

  function showStatus(msg, type) {
    status.textContent = msg;
    status.className = 'status' + (type ? ' ' + type : '');
  }
</script>
