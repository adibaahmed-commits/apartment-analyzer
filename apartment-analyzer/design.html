<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Xtrace Design</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js"></script>
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const {
      Home, ScanLine, LayoutDashboard, Settings, Upload, Zap,
      Building2, DoorOpen, Leaf, MapPin, Gauge
    } = LucideReact;
    const { useEffect, useRef, useState } = React;

    const ACCENT = "#4de8e0";
    const PURPLE = "#8b5cf6";
    const BG_FROM = "#0a0e1a";
    const BG_TO = "#2a1f4d";

    const glass = {
      background: "rgba(255,255,255,0.05)",
      backdropFilter: "blur(16px)",
      WebkitBackdropFilter: "blur(16px)",
      border: "1px solid rgba(255,255,255,0.1)",
    };

    function useReveal() {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) setVisible(true); },
          { threshold: 0.15 }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    function Reveal({ children, delay = 0, className = "" }) {
      const [ref, visible] = useReveal();
      return (
        <div
          ref={ref}
          className={className}
          style={{
            opacity: visible ? 1 : 0,
            transform: visible ? "translateY(0)" : "translateY(28px)",
            transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
          }}
        >
          {children}
        </div>
      );
    }

    function BuildingWireframe({ className = "" }) {
      return (
        <svg viewBox="0 0 200 240" className={className} fill="none">
          <g stroke={ACCENT} strokeWidth="1" opacity="0.9">
            <rect x="40" y="30" width="120" height="200" rx="2" />
            {Array.from({ length: 9 }).map((_, i) => (
              <line key={i} x1="40" y1={30 + i * 22} x2="160" y2={30 + i * 22} opacity="0.5" />
            ))}
            {Array.from({ length: 5 }).map((_, i) => (
              <line key={i} x1={40 + i * 30} y1="30" x2={40 + i * 30} y2="230" opacity="0.5" />
            ))}
            <rect x="90" y="10" width="20" height="20" opacity="0.7" />
            <line x1="10" y1="230" x2="190" y2="230" strokeWidth="1.5" />
          </g>
          <circle cx="100" cy="130" r="70" stroke={PURPLE} strokeOpacity="0.25" />
        </svg>
      );
    }

    function Corner({ style }) {
      return (
        <div
          className="absolute w-8 h-8 md:w-10 md:h-10"
          style={{
            borderTop: `2px solid ${ACCENT}`,
            borderLeft: `2px solid ${ACCENT}`,
            filter: `drop-shadow(0 0 6px ${ACCENT})`,
            ...style,
          }}
        />
      );
    }

    function EnergyRing({ value = 78 }) {
      const r = 40;
      const c = 2 * Math.PI * r;
      return (
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={r} stroke="rgba(255,255,255,0.1)" strokeWidth="8" fill="none" />
          <circle
            cx="50" cy="50" r={r} stroke={ACCENT} strokeWidth="8" fill="none"
            strokeLinecap="round" strokeDasharray={c}
            strokeDashoffset={c - (c * value) / 100}
            transform="rotate(-90 50 50)"
            style={{ filter: `drop-shadow(0 0 6px ${ACCENT})`, transition: "stroke-dashoffset 1.2s ease" }}
          />
          <text x="50" y="55" textAnchor="middle" fontSize="20" fill="#fff" fontWeight="700">{value}%</text>
        </svg>
      );
    }

    function IconRail({ active, onNavigate }) {
      const items = [
        { id: "home", icon: Home, label: "Home" },
        { id: "scan", icon: ScanLine, label: "Scan" },
        { id: "results", icon: LayoutDashboard, label: "Results" },
        { id: "settings", icon: Settings, label: "Settings" },
      ];
      return (
        <nav
          className="fixed z-40 flex items-center gap-2 px-3 py-3 rounded-full
                     bottom-4 left-1/2 -translate-x-1/2 flex-row
                     md:top-1/2 md:-translate-y-1/2 md:left-6 md:bottom-auto md:translate-x-0 md:flex-col md:gap-3"
          style={glass}
        >
          {items.map(({ id, icon: Icon, label }) => {
            const isActive = active === id;
            return (
              <button
                key={id}
                onClick={() => onNavigate(id)}
                title={label}
                aria-label={label}
                className="w-10 h-10 md:w-11 md:h-11 rounded-full flex items-center justify-center transition-all duration-300"
                style={{
                  background: isActive ? `linear-gradient(135deg, ${ACCENT}, ${PURPLE})` : "transparent",
                  boxShadow: isActive ? `0 0 18px ${ACCENT}77` : "none",
                }}
              >
                <Icon size={17} color={isActive ? "#0a0e1a" : "rgba(255,255,255,0.65)"} />
              </button>
            );
          })}
        </nav>
      );
    }

    function FloatingScanButton({ onClick }) {
      return (
        <button
          onClick={onClick}
          className="fixed z-40 bottom-24 right-5 md:bottom-8 md:right-8 px-5 py-4 rounded-full font-semibold text-sm flex items-center gap-2"
          style={{
            background: `linear-gradient(135deg, ${ACCENT}, ${PURPLE})`,
            color: "#0a0e1a",
            boxShadow: `0 0 30px ${ACCENT}66`,
          }}
        >
          <Zap size={16} />
          <span className="hidden sm:inline">Start Scan</span>
        </button>
      );
    }

    function Eyebrow({ children }) {
      return (
        <p className="uppercase tracking-[0.3em] text-xs md:text-sm font-semibold mb-3" style={{ color: ACCENT }}>
          {children}
        </p>
      );
    }

    function Hero({ onScan, onUpload }) {
      const previews = [
        { title: "Riverside Tower", meta: "12 floors · Modern" },
        { title: "Elm Court", meta: "4 floors · Colonial" },
        { title: "Harbor Loft", meta: "6 floors · Industrial" },
        { title: "Cedar Row", meta: "3 floors · Craftsman" },
      ];
      return (
        <section id="home" className="min-h-screen flex flex-col justify-center px-6 md:px-28 pt-28 pb-20 relative">
          <Reveal><Eyebrow>Building intelligence, instantly</Eyebrow></Reveal>
          <Reveal delay={0.08}>
            <h1 className="font-bold text-white leading-[1.05] text-4xl sm:text-5xl md:text-7xl max-w-3xl mb-6">
              Point. Scan.<br />
              <span style={{ color: ACCENT }}>Know the building.</span>
            </h1>
          </Reveal>
          <Reveal delay={0.16}>
            <p className="text-white/60 text-base md:text-lg max-w-xl mb-10">
              Upload a photo of any structure and get floors, style, condition, and market
              context back in seconds — no site visit required.
            </p>
          </Reveal>
          <Reveal delay={0.24}>
            <div className="flex flex-wrap gap-4 mb-16">
              <button
                onClick={onScan}
                className="px-7 py-3.5 md:px-8 md:py-4 rounded-full font-semibold text-sm flex items-center gap-2 transition-transform hover:scale-[1.03]"
                style={{
                  background: `linear-gradient(135deg, ${ACCENT}, ${PURPLE})`,
                  color: "#0a0e1a",
                  boxShadow: `0 0 30px ${ACCENT}55`,
                }}
              >
                Start Scan <Zap size={16} />
              </button>
              <button
                onClick={onUpload}
                className="px-7 py-3.5 md:px-8 md:py-4 rounded-full font-semibold text-sm text-white/80 flex items-center gap-2 border transition-colors hover:bg-white/10"
                style={{ borderColor: "rgba(255,255,255,0.15)", background: "rgba(255,255,255,0.03)" }}
              >
                Upload Building Photo <Upload size={16} />
              </button>
            </div>
          </Reveal>
          <Reveal delay={0.32}>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl">
              {previews.map((p) => (
                <div key={p.title} className="rounded-2xl p-4" style={glass}>
                  <div className="w-full aspect-[4/3] rounded-xl mb-3 flex items-center justify-center" style={{ background: "rgba(255,255,255,0.04)" }}>
                    <BuildingWireframe className="w-1/2 h-1/2 opacity-70" />
                  </div>
                  <p className="text-white text-sm font-semibold">{p.title}</p>
                  <p className="text-white/40 text-xs">{p.meta}</p>
                </div>
              ))}
            </div>
          </Reveal>
        </section>
      );
    }

    function ScanScreen() {
      const [progress, setProgress] = useState(0);
      const [ref, visible] = useReveal();

      useEffect(() => {
        if (!visible) return;
        const id = setInterval(() => {
          setProgress((p) => (p >= 100 ? 100 : p + 2));
        }, 60);
        return () => clearInterval(id);
      }, [visible]);

      const steps = [
        { label: "Detecting structure", done: progress > 20 },
        { label: "Estimating floors", done: progress > 45 },
        { label: "Reading facade material", done: progress > 65 },
        { label: "Cross-referencing listings", done: progress > 85 },
      ];

      return (
        <section id="scan" ref={ref} className="min-h-screen flex flex-col justify-center px-6 md:px-28 py-24">
          <Reveal><Eyebrow>Step 02</Eyebrow></Reveal>
          <Reveal delay={0.05}>
            <h2 className="text-3xl md:text-5xl font-bold text-white mb-10">Analyzing your building</h2>
          </Reveal>
          <div className="flex flex-col lg:flex-row gap-8 items-stretch">
            <Reveal delay={0.1} className="relative w-full lg:w-2/3 aspect-video rounded-2xl overflow-hidden">
              <div className="absolute inset-0 rounded-2xl overflow-hidden" style={glass}>
                <div className="absolute inset-0" style={{ background: "linear-gradient(135deg, #131a2e, #241a3d)" }} />
                <BuildingWireframe className="absolute inset-0 m-auto w-1/2 h-4/5 opacity-80" />
                <Corner style={{ top: 16, left: 16 }} />
                <Corner style={{ top: 16, right: 16, transform: "rotate(90deg)" }} />
                <Corner style={{ bottom: 16, right: 16, transform: "rotate(180deg)" }} />
                <Corner style={{ bottom: 16, left: 16, transform: "rotate(270deg)" }} />
                <div
                  className="absolute left-4 right-4 h-[2px] scanline-anim"
                  style={{ background: ACCENT, boxShadow: `0 0 14px 2px ${ACCENT}` }}
                />
              </div>
            </Reveal>
            <Reveal delay={0.2} className="w-full lg:w-1/3 rounded-2xl p-6 flex flex-col justify-between">
              <div style={glass} className="rounded-2xl p-6 h-full flex flex-col justify-between">
                <div>
                  <p className="text-white/50 text-xs mb-1">Progress</p>
                  <p className="text-white text-3xl font-bold mb-4" style={{ color: ACCENT }}>{progress}%</p>
                  <div className="w-full h-1.5 rounded-full bg-white/10 overflow-hidden mb-6">
                    <div
                      className="h-full rounded-full"
                      style={{
                        width: `${progress}%`,
                        background: `linear-gradient(90deg, ${ACCENT}, ${PURPLE})`,
                        transition: "width 0.15s linear",
                      }}
                    />
                  </div>
                  <div className="flex flex-col gap-3">
                    {steps.map((s) => (
                      <div key={s.label} className="flex items-center gap-3">
                        <span
                          className="w-2 h-2 rounded-full shrink-0"
                          style={{
                            background: s.done ? ACCENT : "rgba(255,255,255,0.2)",
                            boxShadow: s.done ? `0 0 8px ${ACCENT}` : "none",
                          }}
                        />
                        <span className={`text-sm ${s.done ? "text-white" : "text-white/40"}`}>{s.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    function StatCard({ icon: Icon, label, value, delay, className = "" }) {
      return (
        <Reveal delay={delay} className={`rounded-2xl p-5 ${className}`}>
          <div style={glass} className="rounded-2xl p-5 h-full">
            <Icon size={18} color={ACCENT} />
            <p className="text-white/50 text-xs mt-4">{label}</p>
            <p className="text-white text-2xl font-bold mt-1">{value}</p>
          </div>
        </Reveal>
      );
    }

    function ResultsDashboard() {
      return (
        <section id="results" className="min-h-screen px-6 md:px-28 py-24">
          <Reveal><Eyebrow>Step 03</Eyebrow></Reveal>
          <Reveal delay={0.05}>
            <h2 className="text-3xl md:text-5xl font-bold text-white mb-10">Results dashboard</h2>
          </Reveal>
          <div className="grid lg:grid-cols-5 gap-5">
            <Reveal delay={0.1} className="lg:col-span-2">
              <div style={glass} className="rounded-2xl p-6 h-full flex flex-col items-center justify-center min-h-[280px]">
                <BuildingWireframe className="w-2/3 h-2/3" />
                <p className="text-white/40 text-xs mt-4">Pachiteam · Wireframe render</p>
              </div>
            </Reveal>
            <div className="lg:col-span-3 grid grid-cols-2 gap-5">
              <StatCard icon={Building2} label="Year Built" value="2022" delay={0.15} />
              <StatCard icon={DoorOpen} label="Available Units" value="14" delay={0.18} />
              <Reveal delay={0.22} className="col-span-2">
                <div style={glass} className="rounded-2xl p-5 flex items-center justify-between flex-wrap gap-4">
                  <div>
                    <p className="text-white/50 text-xs mb-1">Amenities · Est. Rental Price</p>
                    <p className="text-white text-2xl font-bold">$2,800 / mo</p>
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {["Gym", "Pool", "Concierge"].map((a) => (
                      <span
                        key={a}
                        className="text-xs px-3 py-1.5 rounded-full text-white/70"
                        style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)" }}
                      >
                        {a}
                      </span>
                    ))}
                  </div>
                </div>
              </Reveal>
              <Reveal delay={0.26}>
                <div style={glass} className="rounded-2xl p-5 h-full flex flex-col items-center justify-center text-center">
                  <EnergyRing value={78} />
                  <p className="text-white/50 text-xs mt-3 flex items-center gap-1">
                    <Leaf size={12} color={ACCENT} /> Energy Efficiency
                  </p>
                </div>
              </Reveal>
              <Reveal delay={0.3}>
                <div style={glass} className="rounded-2xl p-5 h-full">
                  <p className="text-white/50 text-xs mb-3 flex items-center gap-1">
                    <MapPin size={12} color={ACCENT} /> Nearby
                  </p>
                  <div className="w-full h-24 rounded-xl mb-3 relative overflow-hidden" style={{ background: "rgba(255,255,255,0.04)" }}>
                    <div
                      className="absolute inset-0"
                      style={{
                        backgroundImage:
                          "linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px)",
                        backgroundSize: "14px 14px",
                      }}
                    />
                    <MapPin
                      size={20}
                      color={ACCENT}
                      className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
                      style={{ filter: `drop-shadow(0 0 6px ${ACCENT})` }}
                    />
                  </div>
                  <p className="text-white/70 text-xs">Gym · Pool · School · Hospital</p>
                </div>
              </Reveal>
            </div>
          </div>
        </section>
      );
    }

    function App() {
      const [active, setActive] = useState("home");

      useEffect(() => {
        const sections = ["home", "scan", "results"];
        const obs = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) setActive(entry.target.id);
            });
          },
          { threshold: 0.5 }
        );
        sections.forEach((id) => {
          const el = document.getElementById(id);
          if (el) obs.observe(el);
        });
        return () => obs.disconnect();
      }, []);

      const goTo = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth" });
      };

      return (
        <div
          className="min-h-screen w-full font-sans relative overflow-x-hidden"
          style={{
            background: `linear-gradient(160deg, ${BG_FROM} 0%, ${BG_TO} 100%)`,
            fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif",
          }}
        >
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
            @keyframes scanmove {
              0% { top: 6%; opacity: 0; }
              10% { opacity: 1; }
              90% { opacity: 1; }
              100% { top: 94%; opacity: 0; }
            }
            .scanline-anim { animation: scanmove 2.6s ease-in-out infinite; }
            html { scroll-behavior: smooth; }
          `}</style>

          <div className="fixed top-6 left-6 md:left-28 z-40 flex items-center gap-2">
            <div
              className="w-8 h-8 rounded-lg flex items-center justify-center"
              style={{ background: `linear-gradient(135deg, ${ACCENT}, ${PURPLE})` }}
            >
              <ScanLine size={16} color="#0a0e1a" />
            </div>
            <span className="text-white font-bold tracking-tight">xtrace</span>
          </div>

          <IconRail active={active} onNavigate={goTo} />
          <FloatingScanButton onClick={() => goTo("scan")} />

          <Hero onScan={() => goTo("scan")} onUpload={() => goTo("scan")} />
          <ScanScreen />
          <ResultsDashboard />

          <footer className="text-center text-white/30 text-xs pb-32 md:pb-10">
            xtrace — building intelligence, instantly
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
